[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-code-reviewer"
version = "0.1.0"
description = "Agent Code Reviewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["pyarrow>=15"]
analysis = ["ruff>=0.6", "bandit>=1.7.9", "uv>=0.6"]
dev = ["pytest>=8"]

[project.scripts]
agent-code-reviewer = "agent_code_reviewer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
